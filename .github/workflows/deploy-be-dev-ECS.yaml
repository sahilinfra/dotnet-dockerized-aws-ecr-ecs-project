name: BE-Dev deploy to Amazon ECS

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sampleapp-be-dev
  ECS_SERVICE: BE-dev-service
  ECS_CLUSTER: SampleApp-DEV
  ECS_TASK_DEFINITION: infra/ecs/sample-be-dev-task-definition.json
  CONTAINER_NAME: be-dev-container
  COMPOSE_FILE: docker-compose.dev.yml
  COMPOSE_SERVICE: webapi
  LOCAL_IMAGE: webapi_be
  ECR_TAG: latest_be

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker compose -f "${{ env.COMPOSE_FILE }}" build "${{ env.COMPOSE_SERVICE }}"
          docker tag "${{ env.LOCAL_IMAGE }}:latest" "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.ECR_TAG }}"
          docker push "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.ECR_TAG }}"
          echo "image=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.ECR_TAG }}" >> "$GITHUB_OUTPUT"

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
