name: Backend Dev deploy to Amazon ECS

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sampleapp-dev-backend
  ECS_SERVICE: sampleapp-dev-backend-service
  ECS_CLUSTER: sampleapp-dev-cluster
  COMPOSE_FILE: docker-compose.dev.yml
  COMPOSE_SERVICE: webapi
  LOCAL_IMAGE: webapi_be
  ECR_TAG: latest_be

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker compose -f "${{ env.COMPOSE_FILE }}" build "${{ env.COMPOSE_SERVICE }}"
          docker tag "${{ env.LOCAL_IMAGE }}:latest" "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.ECR_TAG }}"
          docker push "$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.ECR_TAG }}"
          echo "image=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.ECR_TAG }}" >> "$GITHUB_OUTPUT"

      - name: Force ECS service deployment
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}"
